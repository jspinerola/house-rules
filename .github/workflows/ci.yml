name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install brain deps
        working-directory: brain
        run: pip install -r requirements.txt
      - name: pytest (all flags on stub, plus real-module profile)
        run: pytest -q

  tsc:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [gateway, dashboard, bank-app]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: npm ci
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: tsc --noEmit
        working-directory: ${{ matrix.app }}
        run: npx tsc --noEmit

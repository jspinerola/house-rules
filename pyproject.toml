[project]
name = "house-rules"
version = "0.1.0"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["contracts"]

[tool.pytest.ini_options]
pythonpath = [".", "brain"]
testpaths = ["brain/tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
